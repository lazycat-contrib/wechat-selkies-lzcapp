params:
  - id: auto_start_wechat
    type: bool
    name: "auto start wechat"
    description: "flag to set auto start wechat or not"
    default_value: true

  - id: auto_start_qq
    type: bool
    name: "auto start QQ"
    description: "flag to set auto start QQ or not"
    default_value: false

  - id: timezone
    type: string
    name: "time zone"
    description: "the timezone of this application"
    default_value: "Asia/Shanghai"

locales:
  zh:
    auto_start_wechat:
      name: "是否自动启动微信"
      description: "设置为true将自动启动微信"

    auto_start_qq:
      name: "是否自动启动QQ"
      description: "设置为true将自动启动QQ"

    timezone:
      name: "时区"
      description: "应用程序的时区设置"
