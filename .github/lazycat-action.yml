version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/wechat-selkies.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wechat-selkies

build:
  toolchains: []
  run_buildscript: false

images:
  - id: wechat-selkies
    target: service
    service: wechat-selkies
    source: docker.io/nickrunning/wechat-selkies
    channel: stable
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: WeChat Selkies
    summary: "WeChat Selkies LazyCat package published from GitHub Actions."
